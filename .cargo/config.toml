# Enable the Polonius alpha borrow-checking analysis by default so Cargo,
# rust-analyzer, and verification tools agree about what borrows are legal.
# An inherited RUSTFLAGS value overrides this table; the generated Makefile and
# workflows therefore re-state -Zpolonius=next whenever they set RUSTFLAGS.
#
# The development build standard (concordat rule `rust-build-defaults`) adds
# the parallel rustc frontend to every source and, on Linux, the mold linker.
# The Makefile composes the same flags into the RUSTFLAGS its recipes set.
[build]
rustflags = ["-Zpolonius=next", "-Zthreads=8"]
rustdocflags = ["-Zpolonius=next"]
[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

# mold ships for Linux only, so the linker flag lives in a Linux-only table. A `cfg` table
# matches every Linux target, not one architecture; the triple tables above keep only the
# linker. Other targets, macOS and Windows included, fall through to `[build] rustflags`.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zpolonius=next", "-Zthreads=8", "-C", "link-arg=-fuse-ld=mold"]
